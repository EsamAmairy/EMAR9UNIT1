<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e4e7f4">
<title>Unit 1 Quiz – Present Simple & Present Progressive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4e7f4;
  --hi:#ffffff;
  --lo:#bcc3de;
  --ink:#2a2e4d;
  --soft:#6a6f93;
  --accent:#5b6cff;
  --accent2:#a56bff;
  --ok:#14a883;
  --bad:#e5484d;
  --star:#ffb923;
  --r-lg:28px;
  --r-md:20px;
  --raise:9px 9px 20px var(--lo), -9px -9px 20px var(--hi);
  --raise-sm:5px 5px 11px var(--lo), -5px -5px 11px var(--hi);
  --press:inset 6px 6px 12px var(--lo), inset -6px -6px 12px var(--hi);
  --press-sm:inset 3px 3px 7px var(--lo), inset -3px -3px 7px var(--hi);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  background:var(--bg);color:var(--ink);
  font-family:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  font-size:17px;line-height:1.45;
  padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.app{max-width:560px;margin:0 auto;position:relative;z-index:1}

/* ---------- watermark ---------- */
.wm{
  position:fixed;left:-60%;top:-60%;width:220%;height:220%;
  display:flex;flex-wrap:wrap;align-content:center;justify-content:center;
  transform:rotate(-24deg);
  pointer-events:none;user-select:none;-webkit-user-select:none;
  z-index:100;opacity:.075;color:var(--ink);
  font-family:"Cairo","Segoe UI",Tahoma,sans-serif;font-weight:800;font-size:24px;
}
.wm span{padding:30px 38px;white-space:nowrap}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
.top h1{margin:0;font-size:1.45rem;line-height:1.15;font-weight:700;letter-spacing:-.2px}
.top p{margin:4px 0 0;color:var(--soft);font-size:.95rem}
.dial{
  position:relative;flex:none;width:84px;height:84px;border-radius:50%;
  box-shadow:var(--raise-sm);display:grid;place-items:center;
}
.dial::before{content:"";position:absolute;inset:9px;border-radius:50%;box-shadow:var(--press-sm)}
.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:6;stroke-linecap:round}
.dial .arc{stroke:url(#g);stroke-dasharray:222;stroke-dashoffset:222;transition:stroke-dashoffset .6s cubic-bezier(.3,.8,.3,1)}
.dial b{position:relative;font-size:1.05rem;font-weight:700}
.dial small{position:absolute;bottom:17px;font-size:.62rem;color:var(--soft);font-weight:500}
.dial b{margin-top:-6px}

/* ---------- tabs ---------- */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;border-radius:22px;box-shadow:var(--press);margin-bottom:22px}
.tab{padding:11px 8px;border-radius:17px;font-weight:600;font-size:.95rem;color:var(--soft);transition:box-shadow .2s,color .2s}
.tab[aria-selected="true"]{color:var(--accent);box-shadow:var(--raise-sm);background:var(--bg)}
.tab span{display:block;font-weight:400;font-size:.75rem;opacity:.8}

/* ---------- cards ---------- */
.card{background:var(--bg);border-radius:var(--r-lg);box-shadow:var(--raise);padding:22px 20px}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:.88rem;color:var(--soft);font-weight:500}
.chip{padding:6px 13px;border-radius:14px;box-shadow:var(--press-sm);font-weight:600;color:var(--ink)}
.groove{height:10px;border-radius:10px;box-shadow:var(--press-sm);margin-bottom:20px;overflow:hidden}
.groove i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s ease}
.question{font-size:1.32rem;line-height:1.55;font-weight:500;margin:0 0 22px;min-height:3.1em}
.blank{
  display:inline-block;min-width:3.4em;padding:0 10px;margin:0 2px;border-radius:12px;
  box-shadow:var(--press-sm);text-align:center;color:var(--soft);font-weight:600;
}
.blank.ok{color:var(--ok);animation:pop .35s ease}
.blank.bad{color:var(--bad)}
@keyframes pop{50%{transform:scale(1.12)}}

.options{display:grid;gap:14px;margin:0;padding:0;list-style:none}
.opt{
  width:100%;display:flex;align-items:center;gap:14px;text-align:left;
  padding:13px 16px;border-radius:var(--r-md);box-shadow:var(--raise-sm);
  font-weight:500;font-size:1.08rem;transition:box-shadow .15s, color .15s;
}
.opt:active:not(:disabled){box-shadow:var(--press-sm)}
.badge{
  flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  box-shadow:var(--press-sm);font-size:.9rem;font-weight:700;color:var(--soft)
}
.opt:disabled{cursor:default}
.opt.ok{box-shadow:var(--press-sm);color:var(--ok)}
.opt.ok .badge{background:var(--ok);color:#fff;box-shadow:none}
.opt.bad{box-shadow:var(--press-sm);color:var(--bad)}
.opt.bad .badge{background:var(--bad);color:#fff;box-shadow:none}
.opt.dim{opacity:.55}

.feedback{margin-top:20px;padding:16px 18px;border-radius:var(--r-md);box-shadow:var(--press);font-size:1rem}
.feedback[lang="ar"],.miss .ans{font-family:"Cairo","Segoe UI",Tahoma,sans-serif;line-height:1.8}
.miss .ans{font-weight:600}
.feedback strong{display:block;font-size:1.05rem;margin-bottom:2px}
.feedback.ok strong{color:var(--ok)}
.feedback.bad strong{color:var(--bad)}
.feedback p{margin:0;color:var(--soft)}
[hidden]{display:none!important}

.btn{
  display:block;width:100%;margin-top:20px;padding:15px;border-radius:var(--r-md);
  font-weight:600;font-size:1.05rem;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:7px 7px 16px var(--lo),-6px -6px 14px var(--hi);
}
.btn:active{transform:translateY(1px);box-shadow:3px 3px 8px var(--lo),-3px -3px 8px var(--hi)}
.btn.ghost{color:var(--ink);background:var(--bg);box-shadow:var(--raise-sm)}
.btn.ghost:active{box-shadow:var(--press-sm)}

/* ---------- result ---------- */
.result{text-align:center}
.stars{display:flex;justify-content:center;gap:10px;margin:6px 0 14px}
.stars span{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;box-shadow:var(--press-sm);color:#c5cae0}
.stars span.on{color:var(--star);box-shadow:var(--raise-sm)}
.score{font-size:3.2rem;font-weight:700;line-height:1;margin:6px 0}
.score small{font-size:1.3rem;color:var(--soft);font-weight:500}
.result .msg{color:var(--soft);margin:6px 0 4px}
.missed{margin-top:24px;text-align:left}
.missed h2{font-size:1.05rem;margin:0 0 12px}
.miss{padding:14px 16px;border-radius:var(--r-md);box-shadow:var(--press-sm);margin-bottom:12px;font-size:.98rem}
.miss .ans{display:block;margin-top:6px;font-size:.9rem;color:var(--soft)}
.miss .ans b{color:var(--ok)}
.miss .ans s{color:var(--bad);text-decoration-thickness:2px}

/* ---------- footer ---------- */
.sig{margin:30px 0 0;text-align:center;color:var(--soft);font-size:.9rem}
.sig b{font-family:"Cairo","Segoe UI",Tahoma,sans-serif;color:var(--ink);font-size:1.05rem}

@media (min-width:600px){
  body{font-size:18px;padding-top:40px}
  .card{padding:30px 28px}
  .question{font-size:1.45rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="wm" id="wm" aria-hidden="true"></div>

<main class="app">
  <header class="top">
    <div>
      <h1 id="title">Present Simple &amp; Present Progressive</h1>
      <p id="sub">Choose the correct answer</p>
    </div>
    <div class="dial" role="img" aria-label="Progress" id="dial">
      <svg viewBox="0 0 84 84" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b6cff"/><stop offset="1" stop-color="#a56bff"/></linearGradient></defs>
        <circle class="arc" id="arc" cx="42" cy="42" r="35.3"/>
      </svg>
      <b id="dialNum">0</b><small id="dialTot">/ 28</small>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Quiz sets">
    <button class="tab" role="tab" id="tab0" aria-selected="true">Unit 1<span>Tenses · 28 questions</span></button>
    <button class="tab" role="tab" id="tab1" aria-selected="false">Word Power<span>Vocabulary · 10 questions</span></button>
  </nav>

  <section id="stage" aria-live="polite"></section>

  <p class="sig">إعداد: <b lang="ar" dir="rtl">أ. عصام عمايري</b></p>
</main>

<script>
/* ===== Content ===== */
const SETS = [
 {
  title:"Present Simple & Present Progressive",
  sub:"Unit 1 · Choose the correct answer",
  qs:[
   {q:"The kids don't even ___ they are learning.", o:["knows","know","is knowing","knew"], a:"know", w:"After don't, use the base verb."},
   {q:"We ___ first and when we play we learn.", o:["playing","plays","played","play"], a:"play", w:"A habit with “we” takes the base verb in Present Simple."},
   {q:"Her methods ___ behavior.", o:["improves","improving","improve","improved"], a:"improve", w:"“Methods” is plural, so no -s on the verb."},
   {q:"She ___ a newspaper upstairs now.", o:["reads","is reading","read","was reading"], a:"is reading", w:"“Now” signals an action in progress: Present Progressive."},
   {q:"Parents often ___ the focus on play.", o:["refuse","refuses","refused","are refusing"], a:"refuse", w:"“Often” is a Present Simple clue, and “parents” is plural."},
   {q:"She is fit because she always ___ as an exercise.", o:["runs","ran","is running","run"], a:"runs", w:"“Always” points to a habit. With she, add -s."},
   {q:"She ___ in an elementary school.", o:["teaches","teach","taught","teaching"], a:"teaches", w:"A permanent fact about she: verb + -es (teach → teaches)."},
   {q:"Her pupils don't even ___ an exercise book.", o:["seeing","sees","saw","see"], a:"see", w:"After don't, use the base verb."},
   {q:"I'm busy, I ___ my homework at the moment.", o:["am doing","do","did","does"], a:"am doing", w:"“At the moment” signals Present Progressive."},
   {q:"Be quiet! John ___.", o:["is sleeping","slept","sleep","sleeps"], a:"is sleeping", w:"The action is happening right now."},
   {q:"Mrs. Al-Hroub ___ to establish her own foundation.", o:["planning","plans","plan","planed"], a:"plans", w:"Present Simple with she: add -s."},
   {q:"She uses some of her winnings to train other teachers to ___ her approach.", o:["follows","follow","is following","followed"], a:"follow", w:"After to, use the base verb."},
   {q:"The headmaster ___ to talk to you.", o:["want","is wanting","has want","wants"], a:"wants", w:"“Want” is a state verb, so no -ing. With he/she, add -s."},
   {q:"Every Monday, Sally ___ her kids to football practice.", o:["drives","drove","is driving","drive"], a:"drives", w:"“Every Monday” is a routine. With she, add -s."},
   {q:"Adam and his group members usually ___ on Fridays.", o:["are meeting","meet","met","meets"], a:"meet", w:"“Usually” with a plural subject takes the base verb."},
   {q:"The sun ___ from the East.", o:["rise","rises","rose","is rising"], a:"rises", w:"A scientific fact uses Present Simple. “The sun” is singular."},
   {q:"Nowadays they ___ sign language.", o:["learn","are learning","learned","learns"], a:"are learning", w:"“Nowadays” describes something temporary happening these days."},
   {q:"Usually, I ___ as a secretary.", o:["worked","works","work","am working"], a:"work", w:"“Usually” plus I takes the base verb."},
   {q:"It rarely ___ in the desert.", o:["is raining","rain","rains","rained"], a:"rains", w:"“Rarely” is a Present Simple clue. With it, add -s."},
   {q:"He is ___ a lot these days.", o:["eats","eating","ate","eat"], a:"eating", w:"After is, the verb needs -ing."},
   {q:"You ___ chess with 32 pieces.", o:["playing","plays","play","played"], a:"play", w:"A general fact with you takes the base verb."},
   {q:"Jane ___ with her parents.", o:["are living","lives","live","were living"], a:"lives", w:"Jane = she, so add -s."},
   {q:"The birds ___ to the island every morning.", o:["return","returned","returns","are returning"], a:"return", w:"“Every morning” is a routine, and “birds” is plural."},
   {q:"They ___ usually go out in the evening.", o:["didn't","aren't","don't","doesn't"], a:"don't", w:"They + Present Simple negative = don't."},
   {q:"Marsha ___ to a sport club every Thursday.", o:["went","goes","is going","gone"], a:"goes", w:"“Every Thursday” is a routine. With she: go → goes."},
   {q:"They are not ___ nowadays.", o:["works","work","working","worked"], a:"working", w:"After are not, the verb needs -ing."},
   {q:"She doesn't always ___ tea.", o:["is drinking","drank","drinks","drink"], a:"drink", w:"After doesn't, use the base verb."},
   {q:"Don't forget to take your umbrella. It ___!", o:["rained","is raining","rain","was raining"], a:"is raining", w:"The rain is falling right now: Present Progressive."}
  ]
 },
 {
  title:"Word Forms & Vocabulary",
  sub:"Word Power · Choose the correct answer",
  qs:[
   {q:"I was ___ when my nine-month brother could walk.", o:["astonishing","astonished","astonish","astonishment"], a:"astonished", w:"After was, we need an adjective for how someone feels: astonished."},
   {q:"Life doesn't ___ on Mars.", o:["existence","exists","existing","exist"], a:"exist", w:"After doesn't, use the base verb."},
   {q:"He has no money; he has been ___ for months.", o:["unemployed","employed","unemployment","employee"], a:"unemployed", w:"No money and no job: the adjective unemployed fits after been."},
   {q:"She had a problem in the bank, so she asked to meet the ___.", o:["manage","manager","management","managing"], a:"manager", w:"After the, we need a noun for a person: manager."},
   {q:"The teacher began to ___ the students for their excellent work.", o:["praises","punish","shout","praise"], a:"praise", w:"Excellent work earns praise. After to, use the base verb."},
   {q:"An act of ___ caused the window to be broken.", o:["violence","peace","relaxation","modesty"], a:"violence", w:"A broken window comes from a violent act."},
   {q:"The artist had to ___ a hammer to open his paint cans.", o:["employs","misuse","employ","force"], a:"employ", w:"Employ also means use. After to, use the base verb."},
   {q:"She was wearing a splendid ___.", o:["teeth","outfit","medicine","book"], a:"outfit", w:"You wear an outfit, which is a set of clothes."},
   {q:"His ___ against cancer lasted for two years.", o:["friendship","struggle","kindness","beauty"], a:"struggle", w:"A long fight against an illness is a struggle."},
   {q:"It is worth ___ that Mrs. Al-Hroub's dream was to be a doctor.", o:["mentioned","mention","mentioning","mentions"], a:"mentioning", w:"“Worth” is followed by the -ing form."}
  ]
 }
];

/* ===== Arabic explanations (same order as the questions) ===== */
const AR = [
 [
  "بعد don't نستخدم الفعل في صيغته الأساسية (base form).",
  "عادة مع we في المضارع البسيط، فنستخدم الفعل بدون أي إضافة.",
  "الفاعل methods جمع، لذلك لا نضيف s للفعل.",
  "كلمة now تدل على حدث يجري الآن: المضارع المستمر.",
  "كلمة often من دلائل المضارع البسيط، والفاعل parents جمع.",
  "كلمة always تدل على عادة، ومع she نضيف s للفعل.",
  "حقيقة دائمة مع she: نضيف es للفعل (teach ← teaches).",
  "بعد don't نستخدم الفعل في صيغته الأساسية.",
  "العبارة at the moment تدل على المضارع المستمر.",
  "الحدث يجري الآن (Be quiet!)، لذلك نستخدم المضارع المستمر.",
  "مع she في المضارع البسيط نضيف s للفعل.",
  "بعد to نستخدم الفعل في صيغته الأساسية.",
  "الفعل want من أفعال الحالة فلا نضيف له ing، ومع he/she نضيف s.",
  "عبارة Every Monday تدل على روتين، ومع she نضيف s للفعل.",
  "كلمة usually مع فاعل جمع تأخذ الفعل في صيغته الأساسية.",
  "الحقائق العلمية تأتي في المضارع البسيط، والفاعل the sun مفرد فنضيف s.",
  "كلمة Nowadays تصف شيئاً مؤقتاً يحدث هذه الأيام، فنستخدم المضارع المستمر.",
  "كلمة usually مع I تأخذ الفعل في صيغته الأساسية.",
  "كلمة rarely من دلائل المضارع البسيط، ومع it نضيف s للفعل.",
  "بعد is نحتاج فعلاً بصيغة ing.",
  "حقيقة عامة مع you: الفعل في صيغته الأساسية.",
  "Jane تعني she، لذلك نضيف s للفعل.",
  "عبارة every morning تدل على روتين، والفاعل birds جمع فلا نضيف s.",
  "مع They في نفي المضارع البسيط نستخدم don't.",
  "عبارة every Thursday تدل على روتين، ومع she: go ← goes.",
  "بعد are not نحتاج فعلاً بصيغة ing.",
  "بعد doesn't نستخدم الفعل في صيغته الأساسية.",
  "المطر يهطل الآن، فنستخدم المضارع المستمر."
 ],
 [
  "بعد was نحتاج صفة تصف الشعور: astonished.",
  "بعد doesn't نستخدم الفعل في صيغته الأساسية.",
  "لا يملك مالاً ولا عملاً، والصفة unemployed تناسب بعد been.",
  "بعد the نحتاج اسماً يدل على شخص: manager.",
  "العمل الممتاز يستحق المديح، وبعد to نستخدم الفعل الأساسي praise.",
  "كسر النافذة ينتج عن فعل عنيف: violence.",
  "الفعل employ يأتي بمعنى use، وبعد to نستخدم الفعل الأساسي.",
  "نرتدي outfit، أي مجموعة ملابس.",
  "المعركة الطويلة ضد المرض تسمى struggle.",
  "بعد worth نستخدم صيغة ing: mentioning."
 ]
];

/* ===== Helpers ===== */
const $ = s => document.querySelector(s);
const LETTERS = ["A","B","C","D"];
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,seed){const r=rng(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fillBlank(q,word,cls){
  return esc(q).replace("___",'<span class="blank'+(cls?" "+cls:"")+'">'+(word?esc(word):"&hellip;")+'</span>');
}

/* ===== State ===== */
const states = SETS.map(()=>({i:0,answers:[],round:0}));
let cur = 0;

/* ===== Watermark ===== */
(function(){
  const wm = $("#wm"); let h = "";
  for(let n=0;n<700;n++) h += '<span>عصام عمايري</span>';
  wm.innerHTML = h;
})();

/* ===== Render ===== */
function setDial(done,total){
  const C = 222; // ~ 2*pi*35.3
  $("#arc").style.strokeDashoffset = C * (1 - done/total);
  $("#dialNum").textContent = done;
  $("#dialTot").textContent = "/ " + total;
  $("#dial").setAttribute("aria-label","Answered "+done+" of "+total);
}

function render(){
  const set = SETS[cur], st = states[cur], total = set.qs.length;
  $("#title").textContent = set.title;
  $("#sub").textContent = set.sub;
  document.querySelectorAll(".tab").forEach((t,k)=>t.setAttribute("aria-selected",k===cur));
  setDial(st.answers.length,total);
  if(st.i >= total) renderResult(); else renderQuestion();
}

function renderQuestion(){
  const set = SETS[cur], st = states[cur], total = set.qs.length;
  const q = set.qs[st.i];
  const opts = shuffle(q.o,(st.i+1)*7919 + st.round*104729 + cur*31);
  const score = st.answers.filter(a=>a.ok).length;
  $("#stage").innerHTML = `
    <article class="card">
      <div class="meta"><span>Question ${st.i+1} of ${total}</span><span class="chip">Score ${score}</span></div>
      <div class="groove" aria-hidden="true"><i style="width:${(st.i/total)*100}%"></i></div>
      <p class="question" id="qtext">${fillBlank(q.q)}</p>
      <ul class="options">
        ${opts.map((o,k)=>`<li><button class="opt" data-v="${esc(o)}"><span class="badge">${LETTERS[k]}</span><span>${esc(o)}</span></button></li>`).join("")}
      </ul>
      <div class="feedback" id="fb" hidden></div>
      <button class="btn" id="next" hidden>${st.i+1===total?"See my results":"Next question"}</button>
    </article>`;
  document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(b.dataset.v)));
  $("#next").addEventListener("click",()=>{st.i++;render();window.scrollTo({top:0,behavior:"smooth"});});
}

function answer(pick){
  const set = SETS[cur], st = states[cur], q = set.qs[st.i];
  if(st.answers.length > st.i) return;
  const ok = pick === q.a;
  st.answers.push({pick,ok});
  document.querySelectorAll(".opt").forEach(b=>{
    b.disabled = true;
    const v = b.dataset.v;
    if(v === q.a){b.classList.add("ok");b.querySelector(".badge").textContent="✓";}
    else if(v === pick){b.classList.add("bad");b.querySelector(".badge").textContent="✕";}
    else b.classList.add("dim");
  });
  $("#qtext").innerHTML = fillBlank(q.q,q.a,"ok");
  const fb = $("#fb");
  fb.className = "feedback " + (ok?"ok":"bad");
  fb.setAttribute("dir","rtl");
  fb.setAttribute("lang","ar");
  fb.innerHTML = `<strong>${ok?"إجابة صحيحة!":"إجابة خاطئة. الإجابة الصحيحة: <bdi dir=\"ltr\">"+esc(q.a)+"</bdi>"}</strong><p>${esc(AR[cur][st.i])}</p>`;
  fb.hidden = false;
  $("#next").hidden = false;
  $("#next").focus({preventScroll:false});
  setDial(st.answers.length,set.qs.length);
  document.querySelector(".chip").textContent = "Score " + st.answers.filter(a=>a.ok).length;
  if(!ok && navigator.vibrate) navigator.vibrate(60);
}

function renderResult(){
  const set = SETS[cur], st = states[cur], total = set.qs.length;
  const score = st.answers.filter(a=>a.ok).length;
  const pct = Math.round(score/total*100);
  const stars = pct>=90?3:pct>=70?2:pct>=50?1:0;
  const msg = pct>=90?"Outstanding. You're exam ready!":pct>=70?"Strong work. Check the ones you missed below.":pct>=50?"You're getting there. Read the tips and retry.":"Good start. Read the tips below and try again.";
  const missed = set.qs.map((q,k)=>({q,a:st.answers[k],k})).filter(x=>!x.a.ok);
  const other = 1 - cur;
  $("#stage").innerHTML = `
    <article class="card result">
      <div class="stars" aria-label="${stars} of 3 stars">${[0,1,2].map(k=>`<span class="${k<stars?"on":""}">★</span>`).join("")}</div>
      <div class="score">${score}<small> / ${total}</small></div>
      <p class="msg">${pct}% · ${msg}</p>
      ${missed.length?`
      <div class="missed">
        <h2>Review your mistakes</h2>
        ${missed.map(m=>`<div class="miss">${fillBlank(m.q.q,m.q.a,"ok")}<span class="ans" dir="rtl" lang="ar">اخترت <bdi dir="ltr"><s>${esc(m.a.pick)}</s></bdi><br>الشرح: ${esc(AR[cur][m.k])}</span></div>`).join("")}
      </div>`:`<p class="msg">No mistakes. Perfect round!</p>`}
      <button class="btn" id="again">Try again</button>
      <button class="btn ghost" id="other">Go to ${other===0?"Unit 1":"Word Power"}</button>
    </article>`;
  $("#again").addEventListener("click",()=>{states[cur]={i:0,answers:[],round:st.round+1};render();window.scrollTo({top:0,behavior:"smooth"});});
  $("#other").addEventListener("click",()=>{cur=other;render();window.scrollTo({top:0,behavior:"smooth"});});
}

document.querySelectorAll(".tab").forEach((t,k)=>t.addEventListener("click",()=>{cur=k;render();}));
render();
</script>
</body>
</html>
